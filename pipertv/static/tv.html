<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090B">
  <title>Piper</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tv.css">
  <!-- First, and not deferred: a browser too old for the page below is sent to
       the one written for it before any of this is drawn. -->
  <script src="/tv-check.js"></script>
  <script src="/tv.js" defer></script>
</head>
<body>

<main id="screen-boot" class="screen is-shown">
  <div class="boot">
    <h1 class="wordmark wordmark-xl">piper</h1>
    <div class="boot-bar"><div id="boot-fill" class="boot-fill"></div></div>
    <p id="boot-status" class="mono boot-status">starting</p>
  </div>
  <p id="boot-meta" class="mono boot-meta">raspberry pi</p>
</main>

<main id="screen-home" class="screen">
  <header class="tv-header">
    <div class="wordmark">piper</div>
    <div class="tv-meta">
      <span id="home-source">checking the TV</span>
      <span id="home-clock" class="ink"></span>
      <button id="home-exit" class="back-button exit-button" type="button">exit ✕</button>
    </div>
  </header>

  <section class="history" aria-labelledby="history-heading">
    <h2 id="history-heading" class="section-label">Last opened</h2>
    <ul id="history-list" class="history-list"></ul>
    <p class="mono history-note">launch history only — piper can't see inside these apps</p>
  </section>

  <section class="dial" aria-label="Services">
    <div id="ring" class="ring"></div>
    <div class="focus-caption">
      <div id="focus-name" class="focus-name"></div>
      <div id="focus-note" class="mono focus-note"></div>
    </div>
  </section>

  <p id="ring-hint" class="mono ring-hint"></p>

  <button id="options-corner" class="corner" type="button">
    <span class="corner-name">options</span>
    <span class="mono corner-hint">press left twice · or click</span>
  </button>
</main>

<main id="screen-options" class="screen">
  <header class="tv-header">
    <div class="wordmark">piper<span class="crumb">options</span></div>
    <div class="tv-meta">
      <button id="options-back" class="back-button" type="button">◀ back to the wheel</button>
      <span id="options-state" class="mono">remote &amp; display</span>
      <span id="options-clock" class="ink"></span>
    </div>
  </header>

  <section class="options" aria-label="Piper options">
    <ul id="options-list" class="options-list"></ul>
    <div id="remote-body" class="remote-body" aria-label="The remote" hidden></div>
    <div class="options-detail">
      <div id="option-name" class="focus-name"></div>
      <div id="option-note" class="mono focus-note"></div>
      <div id="option-busy" class="option-busy" hidden></div>
      <p id="options-count" class="mono option-count"></p>
    </div>
  </section>

  <p id="options-hint" class="mono ring-hint"></p>
</main>

<div id="tv-notice" class="notice" role="status" hidden>
  <span id="tv-notice-text"></span>
  <a id="tv-notice-link" class="notice-link" href="#" rel="noreferrer" hidden></a>
</div>

</body>
</html>
